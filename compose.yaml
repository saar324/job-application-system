services:
  job-server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      JOB_SERVER_CONFIG: /app/config/local.json
      JOB_SERVER_DATA: /app/data/state.json
      JOB_SERVER_DATABASE: /app/data/state.sqlite
      JOB_SERVER_TOKENS_FILE: /app/data/tokens.json
      JOB_SERVER_PROFILES_FILE: /app/data/profiles.json
      JOB_SERVER_ALLOWED_DOCUMENT_ROOTS: /app/private-documents
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./private-documents:/app/private-documents:ro
