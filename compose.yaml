services:
  job-server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4310
      JOB_SERVER_CONFIG: /app/config/local.json
      JOB_SERVER_DATA: /app/data/state.json
      JOB_SERVER_DATABASE: /app/data/state.sqlite
      JOB_SERVER_TOKENS_FILE: /app/data/tokens.json
      JOB_SERVER_PROFILES_FILE: /app/data/profiles.json
      JOB_SERVER_DOCUMENT_STAGING: /app/data/documents
      JOB_SERVER_ALLOWED_DOCUMENT_ROOTS: /app/private-documents
      JOB_SERVER_CREDENTIAL_VAULTS: /app/data/vaults
      JOB_SERVER_VAULT_KEYS_FILE: /app/data/vault-keys.json
      APPLICATION_WEBHOOK_URL: http://application-worker:4320/v1/submit
      APPLICATION_WEBHOOK_TOKEN: ${APPLICATION_WORKER_TOKEN:?set APPLICATION_WORKER_TOKEN in .env}
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./private-documents:/app/private-documents:ro
      - job-documents:/app/data/documents
    depends_on:
      - application-worker

  application-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_TOKEN: ${APPLICATION_WORKER_TOKEN:?set APPLICATION_WORKER_TOKEN in .env}
      WORKER_ALLOWED_DOMAINS: ${WORKER_ALLOWED_DOMAINS:-}
      WORKER_HEADLESS: ${WORKER_HEADLESS:-true}
      WORKER_ARTIFACTS: /app/data/artifacts
      WORKER_DOCUMENT_ROOT: /app/data/documents
      WORKER_RECEIPTS: /app/data/receipts
      WORKER_ADAPTIVE_ENABLED: ${WORKER_ADAPTIVE_ENABLED:-false}
      WORKER_ADAPTIVE_ENDPOINT: ${WORKER_ADAPTIVE_ENDPOINT:-}
      WORKER_ADAPTIVE_TOKEN: ${WORKER_ADAPTIVE_TOKEN:-}
      WORKER_ADAPTIVE_PROFILES: ${WORKER_ADAPTIVE_PROFILES:-}
      WORKER_ADAPTIVE_MODES: ${WORKER_ADAPTIVE_MODES:-}
      WORKER_ADAPTIVE_DOMAINS: ${WORKER_ADAPTIVE_DOMAINS:-}
      WORKER_ADAPTIVE_KILL_SWITCH_FILE: ${WORKER_ADAPTIVE_KILL_SWITCH_FILE:-/app/data/disable-adaptive}
      WORKER_DRAFT_ENABLED: ${WORKER_DRAFT_ENABLED:-false}
      WORKER_DRAFT_ENDPOINT: ${WORKER_DRAFT_ENDPOINT:-}
      WORKER_DRAFT_TOKEN: ${WORKER_DRAFT_TOKEN:-}
      WORKER_DRAFT_TIMEOUT_MS: ${WORKER_DRAFT_TIMEOUT_MS:-20000}
    volumes:
      - ./data/artifacts:/app/data/artifacts
      - ./data/receipts:/app/data/receipts
      - job-documents:/app/data/documents:ro

volumes:
  job-documents:
